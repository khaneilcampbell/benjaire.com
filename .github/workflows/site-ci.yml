name: Site CI

# Checks for the live Astro site in site/. Runs on every pull request, not
# only site/ changes, because build-and-test is a required check on main and
# a required check that never runs blocks the merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          # .nvmrc says "22"; without this the runner's cached 22.x is used,
          # which can lag behind the minimum Astro requires.
          check-latest: true
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (site)
        run: npx astro check

      - name: Type check (contact-form Worker)
        run: npm run check:worker

      - name: Worker unit tests
        run: npm run test:worker

      - name: Build
        run: npm run build

      - name: Check internal links
        run: npm run test:links

      - name: Check SEO basics
        run: npm run test:seo

      - name: Install Chromium for accessibility tests
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe, WCAG 2.2 AA)
        run: npm run test:a11y
